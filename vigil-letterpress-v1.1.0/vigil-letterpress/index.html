<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8decc">
  <meta name="description" content="不眠手记 · 一纸一字，写给流年的私人手记">
  <title>不眠手记 · Vigil</title>
  <link rel="stylesheet" href="/src/styles/foundation.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
  <link rel="stylesheet" href="/src/styles/controls.css">
  <link rel="stylesheet" href="/src/styles/pages.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="主要导航">
      <div class="sidebar-grain" aria-hidden="true"></div>
      <div class="sidebar-content">
        <div class="sidebar-small-heading"><span class="sidebar-line"></span> PRIVATE / 001</div>
        <div class="brand">
          <div class="brand-seal" aria-hidden="true">眠</div>
          <div class="brand-type">
            <div class="brand-name">不眠手记</div>
            <div class="brand-sub">VIGIL · PERSONAL ARCHIVE</div>
          </div>
        </div>
        <div class="sidebar-caption">私人文牍 · 民国铅字意象</div>
        <div class="side-label">〇一 / 卷宗目录</div>
        <nav class="nav-list" id="sidebarNav">
          <button class="nav-item" type="button" data-nav="home" data-action="nav" data-to="home"><span data-icon="home"></span><span class="nav-label nav-full">卷首 · 首页</span><span class="nav-label nav-short">首页</span><b>01</b></button>
          <button class="nav-item" type="button" data-nav="entries" data-action="nav" data-to="entries"><span data-icon="list"></span><span class="nav-label nav-full">手记索引</span><span class="nav-label nav-short">手记</span><b>02</b></button>
          <button class="nav-item" type="button" data-nav="editor" data-action="new"><span data-icon="pen"></span><span class="nav-label nav-full">写一篇</span><span class="nav-label nav-short">写作</span><b>03</b></button>
          <button class="nav-item" type="button" data-nav="data" data-action="nav" data-to="data"><span data-icon="archive"></span><span class="nav-label nav-full">档案与备份</span><span class="nav-label nav-short">数据</span><b>04</b></button>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-ticket">
          <div class="ticket-top">PERSONAL RECORD / 民國式刊印</div>
          <p>纸短情长，<br>字里有光。</p>
          <div class="ticket-bottom"><span>刊印于日常</span><span>壹 · 玖 · 叁</span></div>
        </div>
        <div class="sidebar-foot">
          <span class="sidebar-status-dot"></span>
          <span>本地优先 · 不连云端</span>
          <span class="sidebar-edition">ED. II</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="top-brand">
          <span class="top-rail" aria-hidden="true"></span>
          <div>
            <div class="top-eyebrow">VIGIL ARCHIVE　/　个人手记事务所</div>
            <div class="top-title">每个平凡的日子，都值得被郑重收藏。</div>
          </div>
        </div>
        <div class="top-right">
          <span class="today" id="topToday"></span>
          <span class="local-chip" id="storageBadge"></span>
        </div>
      </header>
      <main class="main-inner" id="mainContent" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-layer" id="modalLayer" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
      <div class="modal-overline">NOTICE / 请留意</div>
      <div class="modal-mark" id="modalIcon"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
      <div class="modal-actions">
        <button class="btn" id="modalCancel" type="button">取消</button>
        <button class="btn btn-primary" id="modalConfirm" type="button">确认</button>
      </div>
    </div>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
