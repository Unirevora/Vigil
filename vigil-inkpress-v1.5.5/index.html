<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#34332e">
  <meta name="description" content="不眠手记 · 近代中式复古文房，逐日书写，观四时风物。">
  <title>不眠手记 · VIGIL</title>
  <link rel="icon" type="image/svg+xml" href="/assets/vigil-favicon.svg">
  <link rel="stylesheet" href="/src/styles/foundation.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
  <link rel="stylesheet" href="/src/styles/controls.css">
  <link rel="stylesheet" href="/src/styles/pages.css">
  <link rel="stylesheet" href="/src/styles/typewriter.css">
  <link rel="stylesheet" href="/src/styles/almanac.css">
  <link rel="stylesheet" href="/src/styles/heritage.css">
  <link rel="stylesheet" href="/src/styles/live-editor.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="stylesheet" href="/src/styles/inkpress-reference.css">
  <link rel="stylesheet" href="/src/styles/motion-141.css">
  <link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="/src/styles/appearance-142.css">
  <link rel="stylesheet" href="/src/styles/editor-142.css">
  <link rel="stylesheet" href="/src/styles/glass-150.css">
  <link rel="stylesheet" href="/src/styles/insights-150.css">
  <link rel="stylesheet" href="/src/styles/editor-refine-151.css">
  <link rel="stylesheet" href="/src/styles/polish-152.css">
  <link rel="stylesheet" href="/src/styles/vigil-153.css">
  <link rel="stylesheet" href="/src/styles/vigil-154.css">
  <link rel="stylesheet" href="/src/styles/vigil-155.css">
  <link rel="stylesheet" href="/src/styles/vigil-155-hotfix.css">
</head>
<body>
  <canvas id="spectralDrape" class="spectral-drape" aria-hidden="true"></canvas>
  <svg class="liquid-svg-defs" aria-hidden="true" focusable="false" width="0" height="0" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="vigil-glass-bend" x="-4%" y="-18%" width="108%" height="136%" color-interpolation-filters="sRGB">
        <feImage href="/assets/liquid-displacement.png" x="0%" y="0%" width="100%" height="100%" preserveAspectRatio="none" result="normalMap" />
        <feDisplacementMap in="SourceGraphic" in2="normalMap" scale="18" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
  <div class="shell">
    <aside class="sidebar" aria-label="主导航" id="appSidebar">
      <div class="sidebar-inner">
        <div class="sidebar-edition">PRIVATE JOURNAL · 001</div>
        <div class="brand">
          <div class="brand-seal" aria-hidden="true"><img src="/assets/vigil-mark.svg" alt="" width="59" height="66"></div>
          <div><div class="brand-name">不眠手记</div><div class="brand-sub">VIGIL / 铅字旧梦</div></div>
        </div>
        <button type="button" class="btn btn-primary side-create" data-action="new" title="写一篇手记" aria-label="写一篇手记"><span data-icon="plus"></span><span class="create-label">写一篇手记</span></button>
        <nav class="nav-list" id="sidebarNav">
          <button type="button" class="nav-item" data-nav="home" data-action="nav" data-to="home" title="首页"><span data-icon="home"></span><span class="nav-full">首页</span><span class="nav-short">首页</span></button>
          <button type="button" class="nav-item" data-nav="entries" data-action="nav" data-to="entries" title="全部手记"><span data-icon="book"></span><span class="nav-full">全部手记</span><span class="nav-short">手记</span></button>
          <button type="button" class="nav-item" data-nav="chronicle" data-action="nav" data-to="chronicle" title="日历与风物"><span data-icon="calendar"></span><span class="nav-full">日历与风物</span><span class="nav-short">岁时</span></button>
          <button type="button" class="nav-item" data-nav="insights" data-action="nav" data-to="insights" title="线索与行动"><span data-icon="compass"></span><span class="nav-full">线索与行动</span><span class="nav-short">线索</span></button>
          <button type="button" class="nav-item" data-nav="github" data-action="nav" data-to="github" title="GitHub 仓库"><span data-icon="github"></span><span class="nav-full">GitHub 仓库</span><span class="nav-short">仓库</span></button>
        </nav>
        <button type="button" class="nav-item appearance-entry" data-action="nav" data-to="settings" data-nav="settings"
          title="设置中心" aria-label="设置中心"><span data-icon="settings"></span><span class="nav-full">设置中心</span><span class="nav-short">设置</span></button>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-letter" aria-hidden="true"><span>纸短情长</span><span>字里有光</span></div>
        <div class="sidebar-bottom"><span class="small-dot"></span> 仅此设备 <span class="sidebar-version">ED. 1.5.5</span></div>
      </div>
      <button type="button" class="sidebar-toggle" id="sidebarToggle"
        data-action="toggle-sidebar" aria-controls="sidebarNav" aria-expanded="true"
        title="收起侧边栏" aria-label="收起侧边栏">
        <span data-icon="panel-left-close"></span>
      </button>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="top-right" role="group" aria-label="全局快捷操作"><button type="button" class="icon-button header-settings" data-liquid-glass data-action="nav" data-to="settings" aria-label="打开设置中心" title="设置中心"><span data-icon="settings"></span></button>
        <button type="button" class="header-search" data-liquid-glass data-action="command-palette"
        aria-keyshortcuts="Control+K Meta+K" title="快速搜索与命令 (Ctrl/⌘+K)">
        <span data-icon="search"></span><span>快速检索</span><kbd>⌘ K</kbd>
      </button><span class="today" id="topToday"></span>
          <button type="button" class="icon-button theme-button" data-liquid-glass title="切换纸面主题" aria-label="切换纸面主题" data-action="theme"><span data-icon="moon"></span></button>
        </div>
      </header>
      <main class="main-inner" id="mainContent" tabindex="-1"></main>
    </div>
  </div>
  <nav class="glass-dock" data-liquid-glass aria-label="快捷场景导航">
    <button data-action="nav" data-to="home" data-dock="home" title="首页"><span data-icon="home"></span><span>首页</span></button>
    <button data-action="nav" data-to="entries" data-dock="entries" title="手记"><span data-icon="book"></span><span>手记</span></button>
    <button data-action="new" class="dock-compose" title="新建手记" aria-label="新建手记"><span data-icon="pen"></span></button>
    <button data-action="nav" data-to="insights" data-dock="insights" title="线索与行动"><span data-icon="compass"></span><span>线索</span></button>
    <button data-action="nav" data-to="chronicle" data-dock="chronicle" title="日历与风物"><span data-icon="calendar"></span><span>岁时</span></button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-layer" id="modalLayer" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
      <div class="modal-mark" id="modalIcon"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="modalCancel">取消</button>
        <button type="button" class="btn btn-primary" id="modalConfirm">确认</button>
      </div>
    </div>
  </div>
  <div class="command-layer" id="commandLayer" hidden aria-hidden="true">
    <div class="command-dialog" role="dialog" aria-modal="true" aria-label="快速搜索与命令">
      <div class="command-input-row">
        <span data-icon="search"></span>
        <input id="commandInput" type="search" autocomplete="off" spellcheck="false"
          role="combobox" aria-autocomplete="list" aria-expanded="false"
          aria-label="搜索手记或选择操作" aria-controls="commandResults"
          placeholder="搜索手记、跳转页面或运行命令…">
        <kbd>ESC</kbd>
      </div>
      <div class="command-results" id="commandResults" role="listbox" aria-label="命令与搜索结果"></div>
      <div class="command-footer"><span>↑ ↓ 选择　Enter 打开</span><span>VIGIL / COMMANDS</span></div>
    </div>
  </div>
  <div class="passphrase-layer" id="passphraseLayer" hidden aria-hidden="true">
    <form class="passphrase-dialog" id="passphraseForm" role="dialog" aria-modal="true" aria-labelledby="passphraseTitle">
      <div class="passphrase-seal">密</div>
      <h2 id="passphraseTitle">加密备份</h2>
      <p id="passphraseDesc">口令只在本次操作中使用，不会保存。</p>
      <label for="passphraseInput">备份口令</label>
      <input id="passphraseInput" type="password" autocomplete="new-password" required maxlength="256" minlength="1">
      <div class="passphrase-confirm" id="passphraseConfirmRow" hidden>
        <label for="passphraseRepeat">再次输入口令</label>
        <input id="passphraseRepeat" type="password" autocomplete="new-password" maxlength="256">
      </div>
      <p class="passphrase-hint" id="passphraseHint">建议使用足够长且独一无二的口令。</p>
      <div class="modal-actions">
        <button type="button" class="btn" id="passphraseCancel">取消</button>
        <button type="submit" class="btn btn-primary" id="passphraseOk">确认</button>
      </div>
    </form>
  </div>
  <script src="/vendor/codemirror/codemirror.js"></script>
  <script src="/vendor/codemirror/markdown.js"></script>
  <script src="/vendor/codemirror/continuelist.js"></script>
  <input type="file" id="gitCryptLocalFile" accept=".md,.markdown,.bin,.gpg,application/octet-stream" hidden>
  <input type="file" id="gitCryptKeyFile" accept=".key,.bin,.dat,application/octet-stream" hidden>
  <input type="file" id="importFile" accept=".json,.vigil,application/json" hidden>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
