<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 92" role="img" aria-labelledby="mark-title">
  <title id="mark-title">不眠手记 · 朱砂篆印</title>
  <defs>
    <linearGradient id="seal-wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e7a28c" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ad4939" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="seal-ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5e7ce"/>
      <stop offset="1" stop-color="#dfbaa5"/>
    </linearGradient>
  </defs>
  <!-- Twin hand-ruled frames: a vermilion seal cut into old paper. -->
  <path d="M17 5H67Q78 5 78 17V75Q78 86 66 86H17Q6 86 6 75V17Q6 5 17 5Z" fill="url(#seal-wash)" stroke="#cb7962" stroke-width="1.7"/>
  <path d="M19 12H65Q70 12 70 18V73Q70 79 64 79H19Q14 79 14 73V18Q14 12 19 12Z" fill="none" stroke="#dca28a" stroke-opacity=".75" stroke-width=".8"/>
  <!-- The character 眠, built from geometric strokes instead of dependent fonts. -->
  <g fill="none" stroke="url(#seal-ink)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 26Q23 27 23 30V65L35 64V27Z"/>
    <path d="M23.5 39H34M23.5 52H34" stroke-width="2.6"/>
    <path d="M45 27H59V39H45V51H60"/>
    <path d="M47 39V66M55 40Q56 57 65 66"/>
  </g>
  <!-- Ink drop and a deliberate broken-corner imprint. -->
  <circle cx="64" cy="23" r="2.1" fill="#d5664c"/>
  <path d="M8 69v7q0 8 9 8m50 0q9 0 9-9v-8" fill="none" stroke="#e3b79e" stroke-opacity=".4" stroke-width="1"/>
</svg>
